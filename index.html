<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buenos días, mi rayito de sol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#2f1f5c; --sky-mid:#c8587c; --sky-low:#ffae80; --sky-hor:#ffd9a0;
  --ink:#fff7ee; --ink-soft:#fff0e2; --btn-bg:#fff7ee; --btn-ink:#4a2a5e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky-top:#1b1240; --sky-mid:#a2486f; --sky-low:#e98a74; --sky-hor:#f7c386; color-scheme:dark; }
}
:root[data-theme="dark"]{ --sky-top:#1b1240; --sky-mid:#a2486f; --sky-low:#e98a74; --sky-hor:#f7c386; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 78%,var(--sky-hor) 100%);
  color:var(--ink); font-family:"DM Sans",system-ui,sans-serif; overflow:hidden;
}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;padding-bottom:18vh}

/* Sol */
.sunwrap{position:absolute;left:50%;bottom:7vh;width:0;height:0;animation:rise 3.6s cubic-bezier(.2,.7,.2,1) both}
.sunwrap>*{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%}
.halo{width:150vmax;height:150vmax;background:radial-gradient(circle,rgba(255,240,190,.55) 0%,rgba(255,196,130,.30) 8%,rgba(255,140,120,.14) 20%,transparent 40%)}
.rays{width:130vmax;height:130vmax;background:repeating-conic-gradient(from 0deg,rgba(255,244,200,.30) 0 2deg,transparent 2deg 9deg);
  -webkit-mask-image:radial-gradient(circle,#000 2%,transparent 38%);mask-image:radial-gradient(circle,#000 2%,transparent 38%);animation:spin 160s linear infinite}
.disc{width:min(40vmin,300px);height:min(40vmin,300px);
  background:radial-gradient(circle at 50% 50%,#fffef2 0%,#fff3b8 38%,#ffd86a 70%,#ffb347 100%);
  box-shadow:0 0 30px 12px rgba(255,236,170,.9),0 0 90px 45px rgba(255,190,110,.55),0 0 200px 100px rgba(255,130,110,.30)}
@keyframes rise{from{transform:translateY(42vh)}to{transform:none}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* Nubes */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cloud{position:absolute;left:-45vw;width:var(--w);height:calc(var(--w)*.26);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,226,214,.92) 55%,rgba(244,170,170,.85) 100%);
  filter:blur(var(--b,2px));opacity:var(--o,.9);top:var(--t);animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:42%;height:150%;left:14%;top:-80%}
.cloud::after{width:34%;height:115%;left:50%;top:-50%}
@keyframes drift{to{transform:translateX(190vw)}}
.back{z-index:0}.front{z-index:1}

h1{position:relative;z-index:2;margin:0 0 26px;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(80,20,70,.35)}
#msg{position:relative;z-index:2;margin:0;max-width:30ch;min-height:6.5em;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(1.2rem,4.8vw,1.7rem);line-height:1.45;color:var(--ink-soft);text-shadow:0 1px 16px rgba(80,20,70,.4);transition:opacity .35s}
#msg.out{opacity:0}
button{position:relative;z-index:2;margin-top:16px;font:500 1rem "DM Sans",system-ui,sans-serif;background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 6px 24px rgba(80,20,70,.25)}
button:focus-visible{outline:3px solid #ffe08a;outline-offset:3px}
button:active{transform:scale(.97)}
.heart{position:fixed;bottom:12vh;font-size:1.6rem;pointer-events:none;animation:fly 2.2s ease-out forwards;z-index:3}
@keyframes fly{to{transform:translateY(-45vh) scale(1.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.sunwrap,.rays,.cloud{animation:none}.cloud{left:8vw}.heart{animation-duration:.01s}#msg{transition:none}}
</style>
</head>
<body>
<div class="sky back" aria-hidden="true">
  <div class="cloud" style="--w:220px;--t:9%;--o:.5;--b:3px;--d:150s;--dl:-40s"></div>
  <div class="cloud" style="--w:300px;--t:22%;--o:.55;--b:3px;--d:190s;--dl:-120s"></div>
  <div class="cloud" style="--w:180px;--t:33%;--o:.6;--b:2px;--d:130s;--dl:-90s"></div>
</div>
<div class="sunwrap" aria-hidden="true">
  <div class="halo"></div><div class="rays"></div><div class="disc"></div>
</div>
<div class="sky front" aria-hidden="true">
  <div class="cloud" style="--w:380px;--t:calc(100% - 22vh);--o:.95;--b:1.5px;--d:110s;--dl:-30s"></div>
  <div class="cloud" style="--w:300px;--t:calc(100% - 13vh);--o:.92;--b:1.5px;--d:85s;--dl:-70s"></div>
  <div class="cloud" style="--w:460px;--t:calc(100% - 9vh);--o:1;--b:1px;--d:140s;--dl:-10s"></div>
  <div class="cloud" style="--w:260px;--t:calc(100% - 17vh);--o:.9;--b:2px;--d:100s;--dl:-95s"></div>
</div>
<main>
  <h1 id="title">Buenos días, mi rayito de sol</h1>
  <p id="msg" aria-live="polite"></p>
  <button id="btn" type="button">Otro mensaje para ti</button>
</main>
<script>
var NOMBRE = "mi rayito de sol";
var mensajes = [
  "Hoy el sol salió tarde, porque ya tenía a su rayito favorito despierto.",
  "Que tu día sea tan lindo como la sonrisa con la que despiertas.",
  "Antes de que empiece el mundo, quería ser el primero en decirte que te amo con toda el alma.",
  "Si el día se pone pesado, acuérdate de que alguien está muy orgulloso de ti.",
  "Café, cielo bonito y tú en mi cabeza. Así empieza mi mañana perfecta.",
  "Todo lo que hagas hoy va a salir bien, y si no, aquí estoy yo.",
  "Eres mi vida entera, y no hay mañana que no empiece pensando en ti. Te amo.",
  "Gracias por existir. Contigo hasta los días nublados se ven dorados.",
  "Eres la luz que ilumina todos mis días y la razón por la que quiero ser mejor cada día.",
  "Respira hondo, estírate y recuerda que eres increíble."
];
document.getElementById("title").textContent = "Buenos días, " + NOMBRE;
document.title = "Buenos días, " + NOMBRE;
var msg = document.getElementById("msg");
var i = Math.floor(Date.now() / 86400000) % mensajes.length;
msg.textContent = mensajes[i];
function show(){
  msg.classList.add("out");
  setTimeout(function(){ msg.textContent = mensajes[i]; msg.classList.remove("out"); }, 350);
}
document.getElementById("btn").addEventListener("click", function(e){
  i = (i + 1) % mensajes.length; show();
  var h = document.createElement("div");
  h.className = "heart"; h.textContent = "\u2764\uFE0F";
  h.style.left = (e.clientX || window.innerWidth/2) - 12 + "px";
  document.body.appendChild(h);
  setTimeout(function(){ h.remove(); }, 2300);
});
</script>
</body>
</html>
